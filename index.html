<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>WhatsApp ⇄ Mattermost Converter</title>

<script src="https://cdn.jsdelivr.net/npm/emoji-js/lib/emoji.min.js"></script>

<style>
body {
  margin:0;
  font-family:system-ui;
  background:#0f172a;
  color:#fff;
}
.container {
  max-width:800px;
  margin:auto;
  padding:16px;
}
h1 {
  text-align:center;
  font-size:20px;
}
textarea {
  width:100%;
  min-height:140px;
  border-radius:12px;
  border:none;
  padding:12px;
  margin:10px 0;
  font-size:14px;
}
.buttons {
  display:flex;
  gap:10px;
}
button {
  flex:1;
  padding:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}
.mm { background:#22c55e; }
.wa { background:#25D366; color:#000; }
.copy { background:#64748b; }

.output {
  background:#1e293b;
  padding:12px;
  border-radius:12px;
  margin-top:10px;
  white-space:pre-wrap;
}
</style>
</head>

<body>

<div class="container">
  <h1>WhatsApp ⇄ Mattermost Converter</h1>

  <textarea id="input" placeholder="Masukkan teks WhatsApp atau Mattermost..."></textarea>

  <div class="buttons">
    <button class="mm" onclick="convertToMM()">➜ Mattermost</button>
    <button class="wa" onclick="convertToWA()">➜ WhatsApp</button>
    <button class="copy" onclick="copyOutput()">Copy</button>
  </div>

  <div class="output" id="output"></div>
</div>

<script>
const emoji = new EmojiConvertor();
emoji.replace_mode = 'unified';

// ===== EMOJI =====
function convertEmoji(text) {
  return emoji.replace_colons(text);
}

// ===== WA → MATTERMOST =====
function waToMM(text) {
  text = text.replace(/\*(\S(?:.*?\S)?)\*/g, '**$1**');
  text = text.replace(/_(\S(?:.*?\S)?)_/g, '*$1*');
  text = text.replace(/~(\S(?:.*?\S)?)~/g, '~~$1~~');
  text = text.replace(/^[•\-]\s+(.*)/gm, '- $1');
  return text;
}

// ===== MATTERMOST → WA (FIXED) =====
function mmToWA(text) {
  // 1. Convert link dulu
  text = text.replace(/\[(.*?)\]\((.*?)\)/g, '$1 ($2)');

  // 2. Protect BOLD (**text**)
  text = text.replace(/\*\*([\s\S]*?)\*\*/g, '%%BOLD%%$1%%END%%');

  // 3. Italic (*text*)
  text = text.replace(/\*(.*?)\*/g, '%%ITALIC%%$1%%ENDI%%');

  // 4. Strikethrough
  text = text.replace(/~~(.*?)~~/g, '~$1~');

  // 5. Heading → bold
  text = text.replace(/^#{1,6}\s*(.*)$/gm, '%%BOLD%%$1%%END%%');

  // 6. List
  text = text.replace(/^\s*[-*]\s+(.*)$/gm, '• $1');

  // 7. Handle multiline bold (WA limitation)
  text = text.replace(/%%BOLD%%([\s\S]*?)%%END%%/g, (m, content) => {
    if (content.includes("\n")) {
      return content
        .split("\n")
        .map(line => line.trim() ? `*${line.trim()}*` : "")
        .join("\n");
    }
    return `*${content}*`;
  });

  // 8. Balikin italic
  text = text.replace(/%%ITALIC%%(.*?)%%ENDI%%/g, '_$1_');

  // 9. Rapihin newline
  text = text.replace(/\n{3,}/g, '\n\n');

  return text;
}

// ===== CONVERT =====
function convertToMM() {
  let input = document.getElementById("input").value;
  input = convertEmoji(input);
  let result = waToMM(input);
  document.getElementById("output").textContent = result;
}

function convertToWA() {
  let input = document.getElementById("input").value;
  input = convertEmoji(input);
  let result = mmToWA(input); 
  document.getElementById("output").textContent = result;
}

// ===== COPY =====
function copyOutput() {
  let text = document.getElementById("output").textContent;
  navigator.clipboard.writeText(text).then(() => {
    alert("Copied!");
  });
}
</script>

</body>
</html>
